<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campo Fresco — Panel Admin (Demo)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
.demo-banner{background:#f59e0b;color:#000;text-align:center;padding:10px;font-weight:700;font-size:14px;letter-spacing:.5px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 40px);background:linear-gradient(135deg,#0f1117,#1a2332)}
.login-box{background:#1e2535;border:1px solid #2d3748;border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box .logo{font-size:48px;margin-bottom:12px}
.login-box h1{font-size:22px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.login-box p{color:#64748b;font-size:14px;margin-bottom:28px}
.login-box input[type=password]{width:100%;padding:12px 16px;background:#0f1117;border:1px solid #2d3748;border-radius:8px;color:#e2e8f0;font-size:15px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#22c55e}
.login-box .btn-login{width:100%;padding:12px;background:#22c55e;border:none;border-radius:8px;color:#0f1117;font-size:15px;font-weight:700;cursor:pointer}
.login-box .btn-login:hover{background:#16a34a}
.hint{color:#64748b;font-size:12px;margin-top:10px}
.hint code{background:#0f1117;padding:2px 6px;border-radius:4px;color:#22c55e;font-family:monospace}
.msg{padding:10px 14px;border-radius:8px;margin:12px 0;font-size:14px}
.msg.err{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 40px)}
.sidebar{width:230px;background:#13192a;border-right:1px solid #1e2d3d;display:flex;flex-direction:column;padding:24px 0;position:fixed;top:40px;left:0;height:calc(100vh - 40px)}
.sidebar .brand{padding:0 20px 24px;border-bottom:1px solid #1e2d3d;margin-bottom:16px}
.sidebar .brand span{font-size:22px;font-weight:800;color:#22c55e;display:block}
.sidebar .brand small{font-size:11px;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:.15s;cursor:pointer}
.sidebar a:hover{background:#1e2d3d;color:#e2e8f0}
.sidebar a.active{background:#172033;color:#22c55e;border-right:3px solid #22c55e}
.sidebar a .icon{font-size:18px;width:24px;text-align:center}
.sidebar .bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #1e2d3d}
.btn-logout{width:100%;padding:9px;background:transparent;border:1px solid #334155;border-radius:8px;color:#64748b;font-size:13px;cursor:pointer}

.main{margin-left:230px;flex:1;padding:32px}
.page-title{font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:24px}
.page-title small{font-size:13px;color:#64748b;font-weight:400;margin-left:8px}

.card{background:#1e2535;border:1px solid #2d3748;border-radius:12px;overflow:hidden;margin-bottom:24px}
.card-head{padding:16px 20px;border-bottom:1px solid #2d3748;display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-size:15px;font-weight:600;color:#e2e8f0}
.card-body{padding:20px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:10px 14px;text-align:left;color:#64748b;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #2d3748}
td{padding:12px 14px;border-bottom:1px solid #1a2332;color:#cbd5e1;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-frutas{background:rgba(251,146,60,.15);color:#fb923c}
.badge-verduras{background:rgba(34,197,94,.15);color:#22c55e}
.badge-basicos{background:rgba(148,163,184,.15);color:#94a3b8}
.badge-nuevo{background:rgba(34,197,94,.15);color:#22c55e;font-size:11px;font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:none;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:.15s}
.btn-primary{background:#22c55e;color:#0f1117}
.btn-danger{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.btn-warn{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-blue{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.info-card{background:#13192a;border:1px solid #1e2d3d;border-radius:10px;padding:16px;text-align:center}
.info-card .val{font-size:28px;font-weight:800;color:#22c55e}
.info-card .lbl{font-size:12px;color:#475569;margin-top:4px}
</style>
</head>
<body>

<div class="demo-banner">⚠️ DEMO — Panel de administración de ejemplo (sin base de datos real) — Contraseña: <code style="background:rgba(0,0,0,0.2);padding:2px 6px;border-radius:3px;">admin123</code></div>

<!-- LOGIN -->
<div id="vista-login" class="login-wrap">
  <div class="login-box">
    <div class="logo">🌿</div>
    <h1>Campo Fresco</h1>
    <p>Panel de Administración</p>
    <div id="msg-login" class="msg err" style="display:none">Contraseña incorrecta</div>
    <input type="password" id="inp-pass" placeholder="Contraseña del panel" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <p class="hint">Contraseña: <code>admin123</code></p>
  </div>
</div>

<!-- PANEL -->
<div id="vista-panel" class="layout" style="display:none">

  <nav class="sidebar">
    <div class="brand">
      <span>🌿 Campo Fresco</span>
      <small>Panel Admin (Demo)</small>
    </div>
    <a onclick="seccion('usuarios')" id="nav-usuarios" class="active"><span class="icon">👥</span> Usuarios</a>
    <a onclick="seccion('productos')" id="nav-productos"><span class="icon">🛒</span> Productos</a>
    <a onclick="seccion('mensajes')" id="nav-mensajes"><span class="icon">💬</span> Mensajes <span style="background:#ef4444;color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:auto">2</span></a>
    <a onclick="seccion('pedidos')" id="nav-pedidos"><span class="icon">📦</span> Pedidos <span style="background:#22c55e;color:#0f1117;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:auto">3</span></a>
    <a onclick="seccion('backup')" id="nav-backup"><span class="icon">💾</span> Copias de Seguridad</a>
    <a onclick="seccion('logs')" id="nav-logs"><span class="icon">📋</span> Registros</a>
    <div class="bottom">
      <button class="btn-logout" onclick="doLogout()">⬅ Salir del panel</button>
    </div>
  </nav>

  <div class="main" id="contenido-panel"></div>
</div>

<script>
const PASS = 'admin123';

const DATA = {
    usuarios: [
        { id:1, nombre:'Alex Valls', email:'alexito200830@gmail.com', fecha:'2026-04-10 09:12:00' },
        { id:2, nombre:'Unai Hervella', email:'unai@email.com', fecha:'2026-04-11 11:05:22' },
        { id:3, nombre:'Maria Garcia', email:'maria@email.com', fecha:'2026-05-02 16:30:44' },
    ],
    productos: [
        { id:1, nombre:'Manzanas Ecologicas', precio:3.99, categoria:'frutas', descripcion:'Manzanas de temporada sin pesticidas' },
        { id:2, nombre:'Zanahorias Organicas', precio:2.49, categoria:'verduras', descripcion:'Zanahorias de huerta ecologica' },
        { id:3, nombre:'Lechuga Fresca', precio:1.99, categoria:'verduras', descripcion:'Lechuga cosechada hoy' },
        { id:4, nombre:'Fresas Frescas', precio:4.99, categoria:'frutas', descripcion:'Fresas de temporada' },
        { id:5, nombre:'Brocoli', precio:1.85, categoria:'verduras', descripcion:'Brocoli ecologico fresco' },
    ],
    mensajes: [
        { id:1, nombre:'Laura Perez', email:'laura@email.com', asunto:'consulta', mensaje:'Hola, me gustaria saber si teneis huevos ecologicos disponibles. Gracias!', fecha:'2026-05-28 10:14:00', leido:false },
        { id:2, nombre:'Carlos Martinez', email:'carlos@email.com', asunto:'pedido', mensaje:'Hice un pedido ayer pero aun no he recibido confirmacion, podeis ayudarme?', fecha:'2026-05-29 15:30:00', leido:false },
        { id:3, nombre:'Ana Ruiz', email:'ana@email.com', asunto:'sugerencia', mensaje:'Os propongo anadir aceite de oliva virgen extra ecologico. Seria perfecto!', fecha:'2026-05-25 09:00:00', leido:true },
    ],
    pedidos: [
        { id:1, usuario:'Maria Garcia', email:'maria@email.com', productos:'Manzanas Ecologicas x1, Lechuga Fresca x2', total:5.97, fecha:'2026-05-29 18:22:11' },
        { id:2, usuario:'Unai Hervella', email:'unai@email.com', productos:'Zanahorias Organicas x1, Fresas Frescas x1', total:7.48, fecha:'2026-05-30 09:05:33' },
        { id:3, usuario:'Alex Valls', email:'alexito200830@gmail.com', productos:'Brocoli x2, Lechuga Fresca x1', total:5.69, fecha:'2026-05-30 11:44:20' },
    ],
    backups: [
        { nombre:'2026-05-25_23-00-01', size:'3,1M' },
        { nombre:'2026-05-28_23-00-04', size:'3,2M' },
        { nombre:'2026-05-29_23-00-02', size:'3,2M' },
    ]
};

function doLogin() {
    const pass = document.getElementById('inp-pass').value;
    if (pass === PASS) {
        document.getElementById('vista-login').style.display = 'none';
        document.getElementById('vista-panel').style.display = 'flex';
        seccion('usuarios');
    } else {
        document.getElementById('msg-login').style.display = 'block';
        document.getElementById('inp-pass').value = '';
        document.getElementById('inp-pass').focus();
    }
}
function doLogout() {
    document.getElementById('vista-panel').style.display = 'none';
    document.getElementById('vista-login').style.display = 'flex';
    document.getElementById('inp-pass').value = '';
    document.getElementById('msg-login').style.display = 'none';
}

function seccion(s) {
    ['usuarios','productos','mensajes','pedidos','backup','logs'].forEach(function(x) {
        document.getElementById('nav-'+x).classList.remove('active');
    });
    document.getElementById('nav-'+s).classList.add('active');
    const c = document.getElementById('contenido-panel');

    if (s === 'usuarios') {
        c.innerHTML = '<div class="page-title">👥 Usuarios <small>' + DATA.usuarios.length + ' registrados</small></div>' +
        '<div class="info-grid"><div class="info-card"><div class="val">' + DATA.usuarios.length + '</div><div class="lbl">Total usuarios</div></div></div>' +
        '<div class="card"><div class="card-head"><h3>Lista de usuarios</h3></div><div class="card-body" style="padding:0"><table><thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>Fecha registro</th><th>Acciones</th></tr></thead><tbody>' +
        DATA.usuarios.map(function(u){return '<tr><td>'+u.id+'</td><td>'+u.nombre+'</td><td style="color:#94a3b8">'+u.email+'</td><td style="font-size:12px;color:#64748b">'+u.fecha+'</td><td><button class="btn btn-blue btn-sm">🔑 Contraseña</button> <button class="btn btn-danger btn-sm">🗑 Borrar</button></td></tr>';}).join('') +
        '</tbody></table></div></div>';
    }
    else if (s === 'productos') {
        c.innerHTML = '<div class="page-title">🛒 Productos <small>' + DATA.productos.length + ' en catálogo</small></div>' +
        '<div class="card"><div class="card-head"><h3>Lista de productos</h3></div><div class="card-body" style="padding:0"><table><thead><tr><th>#</th><th>Nombre</th><th>Precio</th><th>Categoría</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody>' +
        DATA.productos.map(function(p){return '<tr><td>'+p.id+'</td><td>'+p.nombre+'</td><td style="color:#22c55e;font-weight:600">'+p.precio.toFixed(2)+' €</td><td><span class="badge badge-'+p.categoria+'">'+p.categoria+'</span></td><td style="color:#64748b;font-size:13px">'+p.descripcion+'</td><td><button class="btn btn-blue btn-sm">✏️ Editar</button> <button class="btn btn-danger btn-sm">🗑 Borrar</button></td></tr>';}).join('') +
        '</tbody></table></div></div>';
    }
    else if (s === 'mensajes') {
        c.innerHTML = '<div class="page-title">💬 Mensajes <small>' + DATA.mensajes.filter(function(m){return !m.leido;}).length + ' sin leer</small></div>' +
        '<div class="card"><div class="card-body" style="padding:0"><table><thead><tr><th>Estado</th><th>Nombre</th><th>Email</th><th>Asunto</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>' +
        DATA.mensajes.map(function(m){
            return '<tr style="'+(m.leido?'opacity:.65':'background:rgba(34,197,94,.04)')+'"><td>'+(m.leido?'<span style="color:#475569;font-size:12px">Leído</span>':'<span style="color:#22c55e;font-weight:700;font-size:12px">● Nuevo</span>')+'</td><td style="font-weight:600">'+m.nombre+'</td><td style="font-size:13px;color:#94a3b8">'+m.email+'</td><td><span class="badge badge-basicos">'+m.asunto+'</span></td><td style="font-size:12px;color:#64748b">'+m.fecha+'</td><td><button class="btn btn-blue btn-sm" onclick="verMsg('+m.id+')">👁 Ver</button>'+(m.leido?'':'<button class="btn btn-primary btn-sm" style="margin-left:4px">✓ Leído</button>')+'<button class="btn btn-danger btn-sm" style="margin-left:4px">🗑</button></td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }
    else if (s === 'pedidos') {
        c.innerHTML = '<div class="page-title">📦 Pedidos <small>' + DATA.pedidos.length + ' realizados</small></div>' +
        '<div class="info-grid"><div class="info-card"><div class="val">' + DATA.pedidos.length + '</div><div class="lbl">Total pedidos</div></div>' +
        '<div class="info-card"><div class="val">' + DATA.pedidos.reduce(function(s,p){return s+p.total;},0).toFixed(2) + '€</div><div class="lbl">Facturación total</div></div></div>' +
        '<div class="card"><div class="card-head"><h3>Historial de pedidos</h3></div><div class="card-body" style="padding:0"><table><thead><tr><th>#</th><th>Usuario</th><th>Email</th><th>Productos</th><th>Total</th><th>Fecha</th></tr></thead><tbody>' +
        DATA.pedidos.map(function(p){
            return '<tr><td>'+p.id+'</td><td style="font-weight:600">'+p.usuario+'</td><td style="font-size:13px;color:#94a3b8">'+p.email+'</td><td style="font-size:13px;color:#64748b">'+p.productos+'</td><td style="color:#22c55e;font-weight:600">'+p.total.toFixed(2)+' €</td><td style="font-size:12px;color:#64748b">'+p.fecha+'</td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }
    else if (s === 'backup') {
        c.innerHTML = '<div class="page-title">💾 Copias de Seguridad <small>' + DATA.backups.length + ' disponibles</small></div>' +
        '<div class="card"><div class="card-head"><h3>Hacer copia ahora</h3></div><div class="card-body"><p style="color:#94a3b8;font-size:14px;margin-bottom:16px">Guarda archivos web y base de datos en disco HDD (esta es una demo, no ejecuta nada).</p><button class="btn btn-primary" onclick="alert(\'Demo: en el panel real se crearía una copia de seguridad\')">💾 Hacer copia ahora</button></div></div>' +
        '<div class="card"><div class="card-head"><h3>Copias disponibles</h3></div><div class="card-body">' +
        DATA.backups.map(function(b){
            var p = b.nombre.split('_'); var fd = p[0].split('-'); var hora = p[1].replace(/-/g,':');
            return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:8px;background:#13192a;border:1px solid #1e2d3d;margin-bottom:8px"><div><div style="font-size:15px;font-weight:600;color:#e2e8f0">📅 '+fd[2]+'/'+fd[1]+'/'+fd[0]+' &nbsp;🕐 '+hora+'</div><div style="font-size:12px;color:#94a3b8;font-family:monospace">'+b.nombre+'/</div></div><div style="display:flex;align-items:center;gap:12px"><span style="font-size:12px;color:#475569">'+b.size+'</span><button class="btn btn-warn btn-sm" onclick="alert(\'Demo: en el panel real se restauraría esta copia\')">⬆️ Restaurar</button></div></div>';
        }).join('') +
        '</div></div>';
    }
    else if (s === 'logs') {
        c.innerHTML = '<div class="page-title">📋 Registros del sistema</div>' +
        '<div class="card"><div class="card-head"><h3>💾 Log de Backups</h3></div><div class="card-body"><div style="background:#0a0e17;border:1px solid #1e2d3d;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;color:#64748b;max-height:250px;overflow-y:auto;white-space:pre-wrap">[2026-05-29 23:00:04] Iniciando backup...\n[2026-05-29 23:00:05] Comprimiendo archivos web...\n[2026-05-29 23:00:07] Exportando base de datos...\n[2026-05-29 23:00:08] Verificando integridad SHA256...\n[2026-05-29 23:00:08] Backup completado: 2026-05-29_23-00-04 (3,2M)\n[2026-05-29 23:00:08] Limpiando copias antiguas (>7 dias)...</div></div></div>' +
        '<div class="card"><div class="card-head"><h3>🚀 Log de Auto-deploy</h3></div><div class="card-body"><div style="background:#0a0e17;border:1px solid #1e2d3d;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;color:#64748b;max-height:250px;overflow-y:auto;white-space:pre-wrap">[2026-05-30 11:44:01] Checking for updates...\n[2026-05-30 11:44:02] Already up to date.\n[2026-05-30 11:38:01] Checking for updates...\n[2026-05-30 11:38:04] Pulling changes from GitHub...\n[2026-05-30 11:38:05] Deploy completado OK.</div></div></div>';
    }
}

function verMsg(id) {
    const m = DATA.mensajes.find(function(x){return x.id===id;});
    if (!m) return;
    alert('De: ' + m.nombre + ' <' + m.email + '>\nAsunto: ' + m.asunto + '\n\n' + m.mensaje);
}
</script>
</body>
</html>
