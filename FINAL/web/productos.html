<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda - Campo Fresco</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { display: flex; min-height: 100vh; background: #f4f6f4; }
    .sidebar { width: 230px; background: #1b5e20; color: #fff; position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.25); }
    .sidebar-logo { background: #2e7d32; padding: 24px 20px; text-align: center; border-bottom: 2px solid rgba(255,255,255,0.08); }
    .sidebar-logo h2 { font-size: 1.25rem; }
    .sidebar-logo p { font-size: 0.74rem; color: rgba(255,255,255,0.65); margin-top: 4px; }
    .sidebar-nav { padding: 18px 0; flex: 1; }
    .sidebar-nav a { display: flex; align-items: center; gap: 11px; padding: 13px 24px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.93rem; transition: background 0.2s; }
    .sidebar-nav a:hover, .sidebar-nav a.activo { background: rgba(255,255,255,0.13); color: #fff; border-left: 3px solid #ff9800; }
    .sidebar-nav .sep { border-top: 1px solid rgba(255,255,255,0.09); margin: 8px 0; }
    .sidebar-usuario { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .nombre-sb { color: #ff9800; font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; }
    .btn-salir-sb { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 8px; border-radius: 7px; cursor: pointer; font-size: 0.84rem; }
    .main-content { margin-left: 230px; flex: 1; }
    .topbar { background: #fff; padding: 13px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 90; }
    .topbar h1 { font-size: 1.15rem; color: #1b5e20; }
    .topbar-right { display: flex; gap: 10px; align-items: center; }
    .topbar input { padding: 9px 14px; border: 1.5px solid #ddd; border-radius: 20px; outline: none; width: 230px; font-size: 0.87rem; transition: border-color 0.3s; }
    .topbar input:focus { border-color: #2f7d32; }
    #btnCesta { background: #ff9800; border: none; color: white; font-weight: bold; cursor: pointer; padding: 9px 18px; border-radius: 7px; font-size: 0.88rem; }
    .filtros-zona { padding: 20px 30px 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filtros-zona span { font-weight: 600; color: #555; font-size: 0.88rem; margin-right: 5px; }
    .filtro-btn { padding: 7px 18px; border: 2px solid #2f7d32; border-radius: 22px; background: none; color: #2f7d32; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.86rem; }
    .filtro-btn:hover { background: #e8f5e9; }
    .filtro-btn.activo { background: #2f7d32; color: #fff; }
    .container { padding: 10px 30px 50px; }
    .section-title { font-size: 1.45rem; color: #1b5e20; margin: 25px 0 18px; border-left: 5px solid #ff9800; padding-left: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-bottom: 38px; }
    .card { background: white; border-radius: 13px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.07); transition: 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 22px rgba(0,0,0,0.11); }
    .card img { width: 100%; height: 185px; object-fit: cover; }
    .card-body { padding: 16px; }
    .card-body h3 { margin-bottom: 5px; font-size: 0.98rem; }
    .card-body p { color: #888; font-size: 0.83rem; margin-bottom: 12px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 1.1rem; color: #2f7d32; font-weight: bold; }
    .btn-buy { background: #ff9800; border: none; color: white; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: background 0.2s; }
    .btn-buy:hover { background: #e68a00; }
    .sin-res { text-align: center; padding: 60px 20px; color: #bbb; font-size: 1rem; }
    .cargando { text-align: center; padding: 60px 20px; color: #888; }
    #toast { position: fixed; top: 18px; right: 18px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; }
    .toast-msg { padding: 13px 18px; border-radius: 10px; font-weight: 600; font-size: 0.86rem; box-shadow: 0 4px 15px rgba(0,0,0,0.12); animation: slideIn 0.3s; max-width: 300px; }
    .toast-exito { background: #e8f5e9; color: #1b5e20; border-left: 4px solid #4caf50; }
    .toast-error { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }
    .toast-info  { background: #e3f2fd; color: #1565c0; border-left: 4px solid #2196f3; }
    @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
    #panelCesta { position: fixed; right: -380px; top: 0; width: 350px; height: 100%; background: #fff; box-shadow: -4px 0 25px rgba(0,0,0,0.14); padding: 22px; transition: 0.3s; overflow-y: auto; z-index: 2000; }
    #panelCesta h2 { color: #2f7d32; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 14px; }
    #listaCesta { list-style: none; }
    #listaCesta li { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.87rem; }
    .btn-rm { background: #ffebee; color: #e53935; border: none; border-radius: 5px; padding: 3px 7px; cursor: pointer; }
    #total-cesta { font-weight: bold; color: #2f7d32; margin-top: 12px; font-size: 1rem; }
    footer { background: #1b5e20; color: white; text-align: center; padding: 20px; font-size: 0.87rem; }
    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
  </style>
</head>
<body>

<div id="toast"></div>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h2>Campo Fresco</h2>
        <p>Tienda Ecologica</p>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html">Inicio</a>
        <a href="productos.html" class="activo">Tienda</a>
        <a href="contacto.html">Contacto</a>
        <div class="sep"></div>
        <a href="quienes-somos.html">Quienes Somos</a>
        <a href="admin.html" id="link-admin" style="display:none;">Administracion</a>
    </nav>
    <div class="sidebar-usuario">
        <div id="nombre-sb" class="nombre-sb">Sin sesion</div>
        <div id="botones-sb"><a href="login.html" style="color:#ff9800;font-size:0.84rem;text-decoration:none;">Iniciar Sesion</a></div>
    </div>
</aside>

<div class="main-content">
    <div class="topbar">
        <h1>Tienda Ecologica</h1>
        <div class="topbar-right">
            <input type="text" id="buscador" placeholder="Buscar producto..." />
            <button id="btnCesta">Cesta (<span id="contador">0</span>)</button>
        </div>
    </div>

    <div class="filtros-zona">
        <span>Filtrar:</span>
        <button class="filtro-btn activo" data-cat="todos" onclick="filtrar(this)">Todos</button>
        <button class="filtro-btn" data-cat="frutas" onclick="filtrar(this)">Frutas</button>
        <button class="filtro-btn" data-cat="verduras" onclick="filtrar(this)">Verduras</button>
        <button class="filtro-btn" data-cat="basicos" onclick="filtrar(this)">Basicos</button>
    </div>

    <div class="container" id="contenido">
        <div class="cargando">Cargando productos...</div>
    </div>

    <div id="panelCesta">
        <h2>Mi Cesta</h2>
        <ul id="listaCesta"></ul>
        <div id="total-cesta"></div>
        <div id="zona-compra"></div>
        <button onclick="cerrarCesta()" style="margin-top:12px;width:100%;padding:10px;background:#f5f5f5;color:#555;border:none;border-radius:7px;cursor:pointer;">Cerrar</button>
    </div>

    <footer><p>&copy; 2026 Campo Fresco - Alex Valls &amp; Unai Hervella - iMES - Proyecto Intermodular</p></footer>
</div>

<script>
var API = '../api';
var sesionActiva = false;
var todosProductos = [];
var catActual = 'todos';
var busqueda = '';

function toast(msg, tipo) {
    tipo = tipo || 'exito';
    var c = document.getElementById('toast');
    var d = document.createElement('div');
    d.className = 'toast-msg toast-' + tipo;
    d.textContent = msg;
    c.appendChild(d);
    setTimeout(function() { d.style.opacity='0'; d.style.transition='opacity 0.4s'; setTimeout(function(){d.remove();},400); }, 2800);
}

(async function() {
    try {
        var res = await fetch(API + '/sesion.php', { credentials: 'include' });
        var data = await res.json();
        if (data.ok) {
            sesionActiva = true;
            document.getElementById('nombre-sb').textContent = data.datos.nombre;
            document.getElementById('botones-sb').innerHTML =
                '<button class="btn-salir-sb" onclick="cerrarSesion()">Cerrar Sesion</button>';
            document.getElementById('link-admin').style.display = 'flex';
        }
    } catch(e) {}
})();

async function cerrarSesion() {
    await fetch(API + '/logout.php', { method: 'POST', credentials: 'include' });
    toast('Sesion cerrada. Hasta pronto!', 'info');
    setTimeout(function(){ window.location.reload(); }, 1000);
}

async function cargarProductos() {
    try {
        var res = await fetch(API + '/productos.php', { credentials: 'include' });
        var data = await res.json();
        if (!data.ok) throw new Error(data.mensaje);
        todosProductos = data.datos;
        renderizar();
    } catch(e) {
        document.getElementById('contenido').innerHTML =
            '<div class="sin-res">Error al cargar productos. Comprueba la conexion.</div>';
    }
}

function filtrar(btn) {
    document.querySelectorAll('.filtro-btn').forEach(function(b){ b.classList.remove('activo'); });
    btn.classList.add('activo');
    catActual = btn.dataset.cat;
    renderizar();
}

function renderizar() {
    var productos = todosProductos.slice();
    if (catActual !== 'todos') productos = productos.filter(function(p){ return p.categoria === catActual; });
    if (busqueda) productos = productos.filter(function(p){
        return p.nombre.toLowerCase().includes(busqueda) || (p.descripcion||'').toLowerCase().includes(busqueda);
    });
    var cont = document.getElementById('contenido');
    cont.innerHTML = '';
    if (!productos.length) {
        cont.innerHTML = '<div class="sin-res">No se encontraron productos con esos criterios.</div>';
        return;
    }
    if (catActual === 'todos' && !busqueda) {
        var cats = { frutas:'Frutas del Sol', verduras:'Verduras de la Huerta', basicos:'Basicos Ecologicos' };
        Object.keys(cats).forEach(function(cat) {
            var prods = productos.filter(function(p){ return p.categoria === cat; });
            if (!prods.length) return;
            var h2 = document.createElement('h2');
            h2.className = 'section-title';
            h2.textContent = cats[cat];
            cont.appendChild(h2);
            cont.appendChild(crearGrid(prods));
        });
    } else {
        var h2 = document.createElement('h2');
        h2.className = 'section-title';
        h2.textContent = 'Resultados (' + productos.length + ')';
        cont.appendChild(h2);
        cont.appendChild(crearGrid(productos));
    }
}

function crearGrid(prods) {
    var g = document.createElement('div');
    g.className = 'grid';
    prods.forEach(function(p) {
        var c = document.createElement('div');
        c.className = 'card';
        c.innerHTML =
            '<img src="' + p.imagen + '" alt="' + p.nombre + '" onerror="this.style.display=\'none\'">' +
            '<div class="card-body">' +
                '<h3>' + p.nombre + '</h3>' +
                '<p>' + (p.descripcion || '') + '</p>' +
                '<div class="price-row">' +
                    '<span class="price">' + parseFloat(p.precio).toFixed(2) + ' EUR</span>' +
                    '<button class="btn-buy">Anadir</button>' +
                '</div>' +
            '</div>';
        c.querySelector('.btn-buy').addEventListener('click', function() { agregarCesta(p); });
        g.appendChild(c);
    });
    return g;
}

document.getElementById('buscador').addEventListener('input', function() {
    busqueda = this.value.toLowerCase().trim();
    renderizar();
});

function agregarCesta(p) {
    if (!sesionActiva) {
        toast('Debes iniciar sesion para anadir al carrito', 'error');
        setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
        return;
    }
    var cesta = JSON.parse(localStorage.getItem('cesta') || '[]');
    cesta.push({ nombre: p.nombre, precio: p.precio });
    localStorage.setItem('cesta', JSON.stringify(cesta));
    actualizarContador();
    toast('"' + p.nombre + '" anadido al carrito', 'exito');
}

function actualizarContador() {
    document.getElementById('contador').textContent = (JSON.parse(localStorage.getItem('cesta') || '[]')).length;
}

function renderizarCesta() {
    var cesta = JSON.parse(localStorage.getItem('cesta') || '[]');
    var lista = document.getElementById('listaCesta');
    lista.innerHTML = '';
    var total = 0;
    if (!cesta.length) {
        lista.innerHTML = '<li style="color:#bbb;text-align:center;padding:20px;">La cesta esta vacia</li>';
    }
    cesta.forEach(function(item, i) {
        total += parseFloat(item.precio);
        var li = document.createElement('li');
        li.innerHTML = '<span>' + item.nombre + '</span><span>' + parseFloat(item.precio).toFixed(2) + 'EUR <button class="btn-rm" data-i="' + i + '">X</button></span>';
        lista.appendChild(li);
    });
    lista.querySelectorAll('.btn-rm').forEach(function(b) {
        b.onclick = function() {
            var c = JSON.parse(localStorage.getItem('cesta') || '[]');
            c.splice(parseInt(b.dataset.i), 1);
            localStorage.setItem('cesta', JSON.stringify(c));
            actualizarContador();
            renderizarCesta();
        };
    });
    document.getElementById('total-cesta').textContent = cesta.length ? 'Total: ' + total.toFixed(2) + 'EUR' : '';

    var zonaCompra = document.getElementById('zona-compra');
    if (cesta.length && sesionActiva) {
        zonaCompra.innerHTML = '<button id="btn-comprar" onclick="comprar()" style="width:100%;margin-top:14px;padding:13px;background:#2f7d32;color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:bold;font-size:1rem;">Comprar ahora (' + total.toFixed(2) + ' EUR)</button>';
    } else if (cesta.length && !sesionActiva) {
        zonaCompra.innerHTML = '<p style="text-align:center;margin-top:14px;font-size:0.82rem;color:#888;">Para comprar, <a href="login.html" style="color:#2f7d32;font-weight:600;">inicia sesion</a> o <a href="login.html" style="color:#2f7d32;font-weight:600;">crea una cuenta</a></p>';
    } else {
        zonaCompra.innerHTML = '';
    }
}

async function comprar() {
    var cesta = JSON.parse(localStorage.getItem('cesta') || '[]');
    if (!cesta.length) return;
    var btn = document.getElementById('btn-comprar');
    if (btn) { btn.disabled = true; btn.textContent = 'Procesando...'; }
    try {
        var res = await fetch(API + '/pedido.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productos: cesta }),
            credentials: 'include'
        });
        var data = await res.json();
        if (data.ok) {
            localStorage.removeItem('cesta');
            actualizarContador();
            renderizarCesta();
            cerrarCesta();
            toast('Pedido realizado con exito! Gracias por tu compra.', 'exito');
        } else {
            toast(data.mensaje || 'Error al procesar el pedido', 'error');
            if (btn) { btn.disabled = false; btn.textContent = 'Comprar ahora'; }
        }
    } catch(e) {
        toast('Error de conexion', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Comprar ahora'; }
    }
}

document.getElementById('btnCesta').onclick = function() {
    document.getElementById('panelCesta').style.right = '0';
    renderizarCesta();
};
function cerrarCesta() { document.getElementById('panelCesta').style.right = '-380px'; }

actualizarContador();
cargarProductos();
</script>
</body>
</html>
